<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Objetos en JavaScript</title>

</head>

<body>

    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="../index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="../img/js.png" class="bi me-2" width="48" height="48">
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="../pages/ejemplo1.html" class="nav-link px-2 text-white">Ejemplo 1</a></li>
                    <li><a href="../pages/ejemplo2.html" class="nav-link px-2 text-white">Ejemplo 2</a></li>
                    <li><a href="../pages/ejemplo3.html" class="nav-link px-2 text-white">Ejemplo 3</a></li>
                    <li><a href="../pages/ejemplo4.html" class="nav-link px-2 text-white">Ejemplo 4</a></li>
                    <li><a href="../pages/ejercicio1.html" class="nav-link px-2 text-white">Ejercicio 1</a></li>
                    <li><a href="../pages/ejercicio2.html" class="nav-link px-2 text-warning fw-bold">
                            <i class="bi bi-check"></i> Ejercicio 2
                        </a></li>

                </ul>

                <div class="text-end">
                    <button type="button" id="idBtnDiv" class="btn btn-outline-light me-2">Nuevo registro</button>
                    <button type="button" id="idBtnButton" class="btn btn-warning">Ingresar</button>
                </div>
            </div>
    </header>

    <div class="container">
        <div class="px-4 py-5 my-5">
            <h1 class="display-5 text-center fw-bold">Consumiendo una API con Fetch</h1>
            <p class="lead text-center mb-4">Ligas de fútbol de Football Highlights API (RapidAPI)</p>
            <form class="row g-3 justify-content-center" onsubmit="return false">
                <div class="col-md-6">
                    <label for="idApiKey" class="form-label fw-bold">API Key de RapidAPI</label>
                    <input type="password" class="form-control" id="idApiKey" autocomplete="off">
                </div>
                <div class="col-md-auto d-flex align-items-end">
                    <button type="button" id="idBtnCargar" class="btn btn-primary">
                        <i class="bi bi-cloud-download"></i> Cargar ligas
                    </button>
                </div>
            </form>
        </div>
        <div id="idMensaje"></div>
        <div class="row g-3" id="idListado"></div>
        <div class="d-flex justify-content-between align-items-center py-4" id="idPaginacion">
            <button type="button" id="idBtnAnterior" class="btn btn-outline-secondary" disabled>
                <i class="bi bi-arrow-left"></i> Anterior
            </button>
            <span id="idInfoPaginacion" class="fw-bold"></span>
            <button type="button" id="idBtnSiguiente" class="btn btn-outline-secondary" disabled>
                Siguiente <i class="bi bi-arrow-right"></i>
            </button>
        </div>
    </div>

    <div class="modal fade" id="idModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalLabel">Detalle de la liga</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="idBodyModal">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ejercicio2.js" defer></script>

</body>

</html>
