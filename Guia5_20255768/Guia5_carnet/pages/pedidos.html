<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café de la Abuela - Gestión de pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center">Café de la Abuela</h1>
      <h2 class="h5 text-center text-muted mb-4">Gestión de pedidos</h2>

      <form id="formPedido" class="card card-body mb-3" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="producto" class="form-label">Producto</label>
            <input type="text" id="producto" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label for="precio" class="form-label">Precio unitario</label>
            <input type="number" id="precio" class="form-control" min="0" step="0.01" required />
          </div>
          <div class="col-md-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" id="cantidad" class="form-control" min="1" step="1" required />
          </div>
        </div>
        <div id="mensajeError" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
        <div class="mt-3">
          <button type="button" id="btnAgregar" class="btn btn-primary">Agregar pedido</button>
        </div>
      </form>

      <div class="card card-body mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="precioMaximo" class="form-label">Precio máximo</label>
            <input type="number" id="precioMaximo" class="form-control" min="0" step="0.01" />
          </div>
          <div class="col-md-8 d-flex flex-wrap gap-2">
            <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar productos</button>
            <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
            <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered bg-white">
          <thead class="table-dark">
            <tr>
              <th>Producto</th>
              <th>Precio unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>

      <div class="alert alert-info d-flex justify-content-between">
        <span>Total de unidades: <strong id="totalUnidades">0</strong></span>
        <span>Monto total: <strong id="montoTotal">$0.00</strong></span>
      </div>
    </div>
  </body>
</html>
